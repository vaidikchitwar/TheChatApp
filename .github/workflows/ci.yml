name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "chore/*", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pytest-cov
          pip install -r requirements.txt

      - name: Run Ruff Linting Check
        run: ruff check .

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chatapp
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_at_least_32_characters_long
          ALGORITHM: HS256
        run: |
          alembic upgrade head

      - name: Execute Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chatapp
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_at_least_32_characters_long
          ALGORITHM: HS256
        run: |
          pytest tests/ -v

  frontend-ci:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-compose-check:
    name: Docker Compose Validation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Container Images
        run: docker compose build
